<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영어 내신 문제은행 생성기</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
  :root{--accent:#1f4e79;--line:#dbe4ef;}
  *{box-sizing:border-box;}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;margin:0;background:#f4f6fa;color:#1c2733;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px;}
  h1{font-size:22px;color:var(--accent);margin:6px 0 4px;}
  .sub{color:#667;margin:0 0 22px;font-size:14px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 18px;margin-bottom:16px;}
  .step{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:20px;padding:3px 10px;margin-right:8px;}
  .card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;}
  label{display:block;font-size:13px;color:#445;margin:10px 0 4px;font-weight:600;}
  input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;}
  input[type=file]{width:100%;font-size:13px;padding:8px 0;}
  .row{display:flex;gap:12px;}
  .row>div{flex:1;}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;resize:vertical;}
  .hint{font-size:12px;color:#889;margin-top:4px;}
  .countbtns{display:flex;gap:10px;}
  .countbtns button{flex:1;padding:14px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#334;}
  .countbtns button.on{border-color:var(--accent);background:#eef4fb;color:var(--accent);}
  .go{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px;}
  .go:disabled{opacity:.5;cursor:not-allowed;}
  #log{white-space:pre-wrap;font-size:13px;color:#456;background:#f8fafd;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:14px;min-height:20px;display:none;}
  .dl{display:none;margin-top:14px;}
  .dl a{display:inline-block;background:#0a7d33;color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:700;margin-right:10px;}
  .warn{font-size:12px;color:#a05a00;background:#fff6e8;border:1px solid #f0d9b0;border-radius:8px;padding:10px 12px;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>영어 내신 문제은행 생성기</h1>
  <p class="sub">기출을 분석해 시험범위·지침에 맞춘 예상문제를 만들어 Word로 내려받습니다.</p>

  <div class="card">
    <h2><span class="step">2</span> 학교 · 학년</h2>
    <div class="row">
      <div><label>학교 이름</label><input id="school" type="text" placeholder="예) 남천중학교" /></div>
      <div><label>학년</label>
        <select id="grade">
          <option>중1</option><option selected>중2</option><option>중3</option>
          <option>고1</option><option>고2</option><option>고3</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2><span class="step">1</span> 기출 시험지 업로드</h2>
    <label>기출 PDF 또는 이미지 (여러 장 가능)</label>
    <input id="gichul" type="file" accept=".pdf,image/*" multiple />
    <div class="hint">스캔본도 됩니다. Claude가 이미지로 직접 읽어 유형·함정을 분석합니다.</div>
  </div>

  <div class="card">
    <h2><span class="step">3</span> 시험범위 업로드</h2>
    <label>범위 자료 파일 (교과서 본문·문법·의사소통·부교재 PDF/이미지, 여러 개 가능)</label>
    <input id="scopeFiles" type="file" accept=".pdf,image/*,.txt" multiple />
    <label>또는 범위를 직접 입력 (본문·목표문법·의사소통·단어 등)</label>
    <textarea id="scopeText" placeholder="예) 동아(윤정미) Lesson 5. 목표문법: 목적격 관계대명사, used to. 의사소통: 교통수단/소요시간. 본문: Street Art in London ..."></textarea>
  </div>

  <div class="card">
    <h2><span class="step">6</span> 문항 수</h2>
    <div class="countbtns">
      <button id="c50" onclick="setCount(50)">50문제</button>
      <button id="c100" class="on" onclick="setCount(100)">100문제</button>
    </div>
  </div>

  <button id="go" class="go" onclick="run()">④ 문제은행 생성하기</button>
  <div id="log"></div>
  <div id="dl" class="dl"></div>
  <div class="warn">※ 생성에는 학원의 Anthropic API 키가 필요하며 1회 생성마다 소액 비용이 발생합니다. 100문항은 시간이 걸릴 수 있어요(1~3분).</div>
</div>

<script>
const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, ShadingType, SectionType, LevelFormat, BorderStyle } = docx;
let COUNT = 100;
function setCount(n){ COUNT=n; document.getElementById('c50').classList.toggle('on',n===50); document.getElementById('c100').classList.toggle('on',n===100); }
function log(m){ const el=document.getElementById('log'); el.style.display='block'; el.textContent += m + "\n"; }
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function packFiles(input){ const out=[]; for(const f of input.files){ out.push({ name:f.name, mediaType:f.type||(f.name.endsWith('.pdf')?'application/pdf':'text/plain'), data:await fileToB64(f) }); } return out; }

function mix(total){
  return total===50
    ? {"어법":10,"독해":13,"어휘":6,"의사소통":6,"서술형":15}
    : {"어법":20,"독해":25,"어휘":13,"의사소통":12,"서술형":30};
}

async function run(){
  const go=document.getElementById('go'); go.disabled=true;
  document.getElementById('log').textContent=''; document.getElementById('dl').style.display='none'; document.getElementById('dl').innerHTML='';
  try{
    const school=document.getElementById('school').value.trim();
    const grade=document.getElementById('grade').value;
    const scopeText=document.getElementById('scopeText').value.trim();
    const gichul=await packFiles(document.getElementById('gichul'));
    const scopeFiles=await packFiles(document.getElementById('scopeFiles'));
    if(!gichul.length){ alert('기출 시험지를 업로드하세요.'); go.disabled=false; return; }
    if(!scopeText && !scopeFiles.length){ alert('시험범위(파일 또는 텍스트)를 입력하세요.'); go.disabled=false; return; }

    log('① 기출 분석 중...');
    const profile = await post('/.netlify/functions/analyze', { school, grade, scopeText, gichul, scopeFiles });
    log('   유형 프로파일 확보 완료.');

    const plan = mix(COUNT);
    const secList=["어법","독해","어휘","의사소통","서술형"];
    let s=1; const meta=secList.map(sec=>{ const m={sec,n:plan[sec],start:s}; s+=plan[sec]; return m; });
    log('② 전 영역 동시 생성 중... (몇 분 걸릴 수 있어요)');
    const results = await Promise.all(meta.map(m =>
      post('/.netlify/functions/generate', { profile, section:m.sec, count:m.n, startNum:m.start, school, grade })
        .then(r => (r.questions||[]).map((q,i)=>{ q.n=m.start+i; q.sec=m.sec; return q; }))
        .then(qs => { log('   ['+m.sec+'] 완료'); return qs; })
    ));
    const all = results.flat();
    log('③ Word 문서 생성 중...');
    const rangeHeader = buildRangeHeader(school, grade, scopeText, profile);
    const munje = await buildDoc(all, profile, rangeHeader, false);
    const dapan = await buildDoc(all, profile, rangeHeader, true);
    showDownloads(school, munje, dapan);
    log('완료! 아래에서 내려받으세요.');
  }catch(e){ log('오류: '+(e.message||e)); }
  go.disabled=false;
}

async function post(url, body){
  const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status));
  return j.questions?j:j; // analyze returns profile object; generate returns {questions}
}

function buildRangeHeader(school, grade, scopeText, profile){
  const gp=(profile.grammarPoints||[]).join(', ');
  const fn=(profile.functions||[]).join(', ');
  const parts=[];
  if(gp) parts.push('문법: '+gp);
  if(fn) parts.push('의사소통: '+fn);
  const scope = scopeText || (profile.passage? '본문 포함' : '');
  return { school, grade, line1:(school||'')+' '+grade+' 영어 예상문제', line2:'[출제 범위] '+(scope? scope+'  ' : '')+parts.join('  /  ') };
}

// ---------- DOCX ----------
const ACCENT="1F4E79";
function H1(t){return new Paragraph({heading:HeadingLevel.HEADING_1,spacing:{before:220,after:90},children:[new TextRun({text:t,bold:true,size:26,color:ACCENT})]});}
function stem(t){return new Paragraph({spacing:{before:110,after:40,line:270},children:[new TextRun({text:t,bold:true,size:18})]});}
function ch(t){return new Paragraph({spacing:{after:20,line:265},indent:{left:100},children:[new TextRun({text:t,size:17})]});}
function box(lines){const W=4500;return new Table({columnWidths:[W],width:{size:W,type:WidthType.DXA},rows:[new TableRow({children:[new TableCell({width:{size:W,type:WidthType.DXA},shading:{type:ShadingType.CLEAR,color:"auto",fill:"F7F9FC"},margins:{top:70,bottom:70,left:110,right:110},children:lines.map(l=>new Paragraph({spacing:{after:22,line:265},children:[new TextRun({text:l,size:17})]}))})]})]});}
function line(){return new Paragraph({spacing:{before:30,after:110},border:{bottom:{style:BorderStyle.SINGLE,size:4,color:"BBBBBB"}},children:[new TextRun({text:" ",size:12})]});}

async function buildDoc(all, profile, hdr, isAnswer){
  const titleParas=[
    new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:40},children:[new TextRun({text:hdr.line1+(isAnswer?'  · 정답·해설(교사용)':'  · 문제지'),bold:true,size:26,color:ACCENT})]}),
    new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:70},border:{bottom:{style:BorderStyle.SINGLE,size:6,color:ACCENT}},children:[new TextRun({text:hdr.line2,size:16,color:"555555"})]}),
    new Paragraph({spacing:{after:20},children:[new TextRun({text:" ",size:8})]}),
  ];
  const body=[];
  if(isAnswer){
    let cur="";
    all.forEach(q=>{
      if(q.sec!==cur){cur=q.sec;body.push(H1("["+cur+"]"));}
      body.push(new Paragraph({spacing:{after:22,line:260},children:[new TextRun({text:q.n+". 정답 ",bold:true,size:17}),new TextRun({text:String(q.ans||''),bold:true,size:17,color:"C00000"}),new TextRun({text:"  |  "+(q.sol||''),size:15})]}));
      if(q.tag) body.push(new Paragraph({spacing:{after:40},indent:{left:150},children:[new TextRun({text:q.tag,size:13,italics:true,color:"7030A0"})]}));
    });
  }else{
    let cur="";
    const T={"어법":"Ⅰ. 어법","독해":"Ⅱ. 독해 — 아래 [본문]을 읽고 답하시오","어휘":"Ⅲ. 어휘","의사소통":"Ⅳ. 의사소통","서술형":"Ⅴ. 서술형"};
    all.forEach(q=>{
      if(q.sec!==cur){cur=q.sec;body.push(H1(T[cur]||q.sec));
        if(cur==="독해" && profile.passage){ body.push(box(["[본문]"].concat(String(profile.passage).split(/\n+/).filter(Boolean)))); }
      }
      body.push(stem(q.stem||(q.n+".")));
      if(q.box&&q.box.length) body.push(box(q.box));
      (q.ch||[]).forEach(c=>body.push(ch(c)));
      if(q.sec==="서술형") body.push(line());
    });
  }
  const doc=new Document({
    numbering:{config:[]},
    styles:{default:{document:{run:{font:"Malgun Gothic",size:18}}}},
    sections:[
      {properties:{page:{margin:{top:800,bottom:800,left:800,right:800}}},children:titleParas},
      {properties:{type:SectionType.CONTINUOUS,column:{count:2,space:440,separate:true},page:{margin:{top:800,bottom:800,left:800,right:800}}},children:body},
    ]
  });
  return await Packer.toBlob(doc);
}
function showDownloads(school, munje, dapan){
  const box=document.getElementById('dl'); box.style.display='block';
  const base=(school||'예상문제').replace(/\s+/g,'_');
  box.appendChild(mkLink(munje, base+'_문제지.docx', '📄 문제지 내려받기'));
  box.appendChild(mkLink(dapan, base+'_답안지.docx', '✅ 답안지 내려받기'));
}
function mkLink(blob, name, text){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.textContent=text; return a;
}
</script>
</body>
</html>
